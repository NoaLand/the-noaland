name: NoaLand Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: noaland-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout version tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Validate tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid version tag"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist package
          binary=noaland
          if [[ "$TARGET_OS" == windows ]]; then binary=noaland.exe; fi
          go build -trimpath -ldflags="-s -w" -o "package/$binary" ./the-noaland/cmd/noaland
          cp README.md LICENSE package/
          name="noaland-${RELEASE_TAG}-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "$TARGET_OS" == windows ]]; then
            (cd package && zip "../dist/$name.zip" "$binary" README.md LICENSE)
          else
            tar -czf "dist/$name.tar.gz" -C package "$binary" README.md LICENSE
          fi
          # Keep directly downloadable binaries as well as convenient archives.
          suffix=""
          if [[ "$TARGET_OS" == windows ]]; then suffix=".exe"; fi
          cp "package/$binary" "dist/noaland-${TARGET_OS}-${TARGET_ARCH}${suffix}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noaland-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts and calculate checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "dist/noaland-darwin-$arch"
            test -s "dist/noaland-windows-$arch.exe"
            test -s "dist/noaland-${RELEASE_TAG}-darwin-$arch.tar.gz"
            test -s "dist/noaland-${RELEASE_TAG}-windows-$arch.zip"
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true